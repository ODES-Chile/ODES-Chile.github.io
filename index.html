<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Redirigiendo...</title>
  <!-- Redirección instantánea para navegadores y buscadores -->
  <meta http-equiv="refresh" content="0; url=https://tu-nueva-url.com">
  <!-- Indica a Google cuál es la URL oficial (bueno para SEO) -->
  <link rel="canonical" href="https://francisco-zambrano.cl">
  <!-- Respaldo con JavaScript -->
  <script>
    window.location.replace("https://francisco-zambrano.cl");
  </script>
</head>
<body>
  <p>Si no eres redirigido automáticamente, haz clic <a href="https://francisco-zambrano.cl">aquí</a>.</p>
</body>
</html>
